# Delete these routes and define your own shop routes here

steve_boulay_sylius_sandbox_payment_static_welcome:
    path: /static-welcome/{name}
    defaults:
        _controller: SteveBoulay\SyliusSandboxPaymentPlugin\Controller\GreetingController::staticallyGreetAction
        name: ~

steve_boulay_sylius_sandbox_payment_dynamic_welcome:
    path: /dynamic-welcome/{name}
    defaults:
        _controller: SteveBoulay\SyliusSandboxPaymentPlugin\Controller\GreetingController::dynamicallyGreetAction
        name: ~
